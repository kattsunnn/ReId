[project]
name = "person_re_identification"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "naoki", email = "katsudanaoki@gmail.com" }
]

requires-python = ">=3.12"
dependencies = [
    "gdown",
    "numpy",
    "pillow",
    "scikit-learn",
    "tensorboard",
    "torch",
    "torchreid",
    "torchvision",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/person_re_identification"]

[tool.uv.sources]
img-utils = { git = "https://github.com/kattsunnn/img_utils.git" }

[dependency-groups]
dev = [
    "img-utils",
    "matplotlib>=3.10.8",
]
